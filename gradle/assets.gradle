// Keep development launches independent of any installed Minecraft instance.
ext.minecraftGameHome = layout.projectDirectory.dir('.gradle/minecraft-home')
ext.minecraftAssetIndex = '16'
// Buildship refresh has no command-line -P arguments. Retain a prepared local
// client location rather than requiring its assets/natives to be copied.
Properties localMinecraftSetup = new Properties()
File localMinecraftSetupFile = file('gradle-local.properties')
if (localMinecraftSetupFile.isFile()) localMinecraftSetupFile.withInputStream { localMinecraftSetup.load(it) }
String assetFolder=org.gradle.internal.os.OperatingSystem.current().isMacOsX()?'Library/Application Support/minecraft/assets':'.minecraft/assets'
ext.minecraftAssets = layout.projectDirectory.dir(providers.gradleProperty('minecraftAssetsDirectory')
        .getOrElse(localMinecraftSetup.getProperty('minecraftAssetsDirectory',minecraftGameHome.dir(assetFolder).asFile.absolutePath)))
ext.minecraftNatives = layout.projectDirectory.dir(providers.gradleProperty('minecraftNativesDirectory')
        .getOrElse(localMinecraftSetup.getProperty('minecraftNativesDirectory','.gradle/native1206-client-inputs/natives')))
tasks.register('prepareMinecraftAssets') {
    group = 'ide'
    doLast {
        File root=minecraftAssets.asFile.canonicalFile
        boolean owned = root.toPath().startsWith(minecraftGameHome.asFile.canonicalFile.toPath())
        def sha1={File value -> java.security.MessageDigest.getInstance('SHA-1').digest(value.bytes).encodeHex().toString()}
        def download={String url,String expected,File output ->
            if(!output.isFile() || sha1(output)!=expected) {
                if (!owned || !output.canonicalFile.toPath().startsWith(root.toPath()))
                    throw new GradleException("Missing or changed asset in read-only location: ${output}")
                output.parentFile.mkdirs()
                File pending=new File(output.parentFile,output.name+'.download')
                new URL(url).withInputStream { input -> pending.withOutputStream { stream -> stream << input } }
                if(sha1(pending)!=expected)throw new GradleException("Minecraft asset checksum mismatch: ${output.name}")
                java.nio.file.Files.move(pending.toPath(),output.toPath(),java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            }
        }
        File descriptor=new File(root,'1.20.6.json')
        download('https://piston-meta.mojang.com/v1/packages/4dd84bf5b646a75cba5c0c5f7723eb478a2b78af/1.20.6.json','4dd84bf5b646a75cba5c0c5f7723eb478a2b78af',descriptor)
        def version=new groovy.json.JsonSlurper().parse(descriptor)
        if(version.id!='1.20.6' || version.assetIndex.id!=minecraftAssetIndex)
            throw new GradleException('Prepared Minecraft client metadata has the wrong target identity')
        File index=new File(root,"indexes/${minecraftAssetIndex}.json")
        download(version.assetIndex.url,version.assetIndex.sha1,index)
        Set<String> hashes=new groovy.json.JsonSlurper().parse(index).objects.values().collect {it.hash} as Set
        hashes.each {hash ->
            String relative=hash.substring(0,2)+'/'+hash
            download('https://resources.download.minecraft.net/'+relative,hash,new File(root,'objects/'+relative))
        }
        logger.lifecycle("Verified ${hashes.size()} official Minecraft asset objects")
    }
}
