def runDirectory = layout.buildDirectory.dir('integration-run')
tasks.register('prepareIntegrationTest') {
    dependsOn probeJar
    doLast {
        File root = runDirectory.get().asFile
        if (root.exists()) {
            File history = layout.buildDirectory.dir('runtime-history/' + System.currentTimeMillis()).get().asFile
            history.parentFile.mkdirs()
            if (!root.renameTo(history)) throw new GradleException('Cannot preserve previous runtime evidence')
        }
        new File(root,'mods').mkdirs()
        copy { from probeJar; into new File(root,'mods') }
        new File(root,'eula.txt').text = 'eula=true\n'
        ['ops','whitelist','banned-players','banned-ips'].each { new File(root,"${it}.json").text='[]\n' }
        new File(root,'server.properties').text = '''level-name=world
level-seed=4267321
level-type=FLAT
online-mode=false
server-ip=127.0.0.1
server-port=0
generate-structures=false
spawn-animals=false
spawn-monsters=false
spawn-protection=0
max-tick-time=120000
'''
    }
}

// Reuse FG7's actual bootstrap, mappings, natives and pinned Java launcher.
def phaseTask = { String phase, Object prerequisite ->
    tasks.register("integration${phase.capitalize()}Process", JavaExec) {
        group = 'verification'
        dependsOn prerequisite
        dependsOn { def run = tasks.getByName('runServer'); run.taskDependencies.getDependencies(run) }
        actions.clear()
        doLast {
            JavaExec run = tasks.getByName('runServer')
            def options = minecraft.runs.getByName('server')
            File previousDir = options.workingDir.get().asFile
            def previousProperties = new LinkedHashMap(run.systemProperties)
            def previousClasspath = files(run.classpath)
            try {
                options.workingDir.set(runDirectory)
                run.workingDir(runDirectory)
                run.systemProperty('lootablebodies.phase', phase)
                run.systemProperty('log4j.configurationFile', file('src/integrationTest/resources/log4j2.xml').toURI())
                run.executable = productionLauncher.get().executablePath.asFile.path
                run.setClasspath(files(developmentOutput, run.classpath.filter { !sourceSets.main.output.files.contains(it) }))
                run.exec()
            } finally {
                options.workingDir.set(previousDir)
                run.workingDir(previousDir)
                run.setSystemProperties(previousProperties)
                run.setClasspath(previousClasspath)
            }
            File marker = new File(runDirectory.get().asFile,"world/${phase}.pass")
            if (!marker.isFile()) throw new GradleException("Missing ${phase} corpse preservation marker")
            File logs = new File(runDirectory.get().asFile,'logs/latest.log')
            if (!logs.isFile() || logs.text =~ /(?i)(AssertionError|Encountered an unexpected exception|Exception stopping server)/)
                throw new GradleException("Runtime failure in ${logs}")
            copy { from logs; into runDirectory; rename { "${phase}.log" } }
            if (!fileTree(new File(runDirectory.get().asFile,'crash-reports')).isEmpty())
                throw new GradleException('Runtime crash reports found')
        }
    }
}
