// A separate run model keeps the independent control isolated even after
// Eclipse generation has finalized the production models' environment.
minecraft.runs.register('platformControl') {
    client=false
    args '--nogui'
    workingDir=layout.buildDirectory.dir('forge-control-run')
    String root=layout.buildDirectory.dir('forge15-development/control').get().asFile.absolutePath
    environment.put('MOD_CLASSES',"forgeplatformcontrol%%${root}${File.pathSeparator}forgeplatformcontrol%%${root}")
}
tasks.register('forgeControlServer') {
    group='verification'
    timeout=java.time.Duration.ofMinutes(2)
    dependsOn controlJar
    dependsOn { def run=tasks.getByName('runPlatformControl'); run.taskDependencies.getDependencies(run) }
    doLast {
        File root=layout.buildDirectory.dir('forge-control-run').get().asFile
        if(root.exists()) {
            File history=layout.buildDirectory.dir('runtime-history/control-'+System.currentTimeMillis()).get().asFile
            history.parentFile.mkdirs();if(!root.renameTo(history))throw new GradleException('Cannot preserve previous control evidence')
        }
        new File(root,'mods').mkdirs()
        File controlOutput=layout.buildDirectory.dir('forge15-development/control').get().asFile
        copy { from controlClasses;from 'src/controlTest/resources';into controlOutput }
        new File(root,'eula.txt').text='eula=true\n'
        new File(root,'server.properties').text='level-name=world\nlevel-type=FLAT\nserver-ip=127.0.0.1\nserver-port=0\nonline-mode=false\n'
        ['ops','whitelist','banned-players','banned-ips'].each { new File(root,"${it}.json").text='[]\n' }
        JavaExec run=tasks.getByName('runPlatformControl')
        def options = minecraft.runs.getByName('platformControl')
        File previousDir = options.workingDir.get().asFile
        File previousRunDir = run.workingDir
        def previousProperties = new LinkedHashMap(run.systemProperties)
        def previousClasspath = files(run.classpath)
        def previousEnvironment = new LinkedHashMap(run.environment)
        try {
            options.workingDir.set(root)
            run.workingDir(root)
            run.systemProperty('log4j.configurationFile',file('src/integrationTest/resources/log4j2.xml').toURI())
            run.setClasspath(files(controlOutput,run.classpath.filter { !sourceSets.main.output.files.contains(it) && it != developmentOutput.get().asFile }))
            run.exec()
        } finally {
            options.workingDir.set(previousDir)
            run.workingDir(previousRunDir)
            run.setSystemProperties(previousProperties)
            run.setClasspath(previousClasspath)
            run.setEnvironment(previousEnvironment)
        }
        String text=new File(root,'logs/latest.log').text
        if(!text.contains('FORGE_PLATFORM_CONTROL_PASS') || text.contains('lootablebodies@')) throw new GradleException('Invalid independent platform control')
    }
}
