tasks.register('clientIntegrationTest') {
    group = 'verification'
    dependsOn probeJar
    dependsOn { def run = tasks.getByName('runClient'); run.taskDependencies.getDependencies(run) }
    doLast {
        File root = file(providers.gradleProperty('clientIntegrationDirectory').getOrElse('build/client-integration-run'))
        if(root.exists()) throw new GradleException('Preserve the previous client evidence before rerunning')
        new File(root,'mods').mkdirs()
        new File(root,'config').mkdirs()
        new File(root,'options.txt').text='realmsNotifications:false\n'
        copy { from probeJar; into new File(root,'mods') }
        new File(root,'config/lootablebodies.cfg').text = 'options {\n B:local_texture=true\n}\n'
        JavaExec run = tasks.getByName('runClient')
        def options = minecraft.runs.getByName('client')
        File previousDir = options.workingDir.get().asFile
        File previousRunDir = run.workingDir
        def previousProperties = new LinkedHashMap(run.systemProperties)
        def previousClasspath = files(run.classpath)
        String previousExecutable = run.executable
        try {
            options.workingDir.set(root)
            run.workingDir(root)
            run.systemProperty('lootablebodies.clientCheck','true')
            run.systemProperty('log4j.configurationFile',file('src/integrationTest/resources/log4j2.xml').toURI())
            run.executable = productionLauncher.get().executablePath.asFile.path
            run.setClasspath(files(developmentOutput,run.classpath.filter { !sourceSets.main.output.files.contains(it) }))
            run.exec()
        } finally {
            options.workingDir.set(previousDir)
            run.workingDir(previousRunDir)
            run.setSystemProperties(previousProperties)
            run.setClasspath(previousClasspath)
            run.executable = previousExecutable
        }
        if(!new File(root,'client.pass').isFile()) throw new GradleException('Client did not preserve/reopen/render the corpse GUI')
        if(!fileTree(new File(root,'crash-reports')).isEmpty()) throw new GradleException('Client crash report')
    }
}
tasks.register('exportRuntimeClasspath') {
    group='verification'
    doLast {
        File output=layout.buildDirectory.file('runtime-classpath.json').get().asFile
        output.parentFile.mkdirs()
        output.text=groovy.json.JsonOutput.toJson(configurations.runtimeClasspath.files*.absolutePath)
    }
}

def controlClasses = layout.buildDirectory.dir('control-test-mod/classes')
tasks.register('compileForgeControl',JavaCompile) {
    source fileTree('src/controlTest/java')
    classpath=sourceSets.main.compileClasspath
    destinationDirectory=controlClasses
    options.compilerArgs.add('-proc:none')
}
def controlJar=tasks.register('forgeControlJar',Jar) {
    dependsOn 'compileForgeControl'
    from controlClasses
    archiveFileName='forge-platform-control.jar'
    destinationDirectory=layout.buildDirectory.dir('control-test-mod')
}
def packagedControl=renamer.classes(controlJar) {
    map.from minecraft.dependency.toSrgFile
    libraries.from(sourceSets.main.compileClasspath)
    output=layout.buildDirectory.file('control-test-mod/forge-platform-control-reobf.jar')
}
tasks.register('preparePackagedForgeControl') { dependsOn packagedControl }
tasks.register('forgeControlServer') {
    group='verification'
    dependsOn controlJar
    dependsOn { def run=tasks.getByName('runServer'); run.taskDependencies.getDependencies(run) }
    doLast {
        File root=layout.buildDirectory.dir('forge-control-run').get().asFile
        new File(root,'mods').mkdirs()
        copy { from controlJar; into new File(root,'mods') }
        new File(root,'eula.txt').text='eula=true\n'
        new File(root,'server.properties').text='level-name=world\nlevel-type=FLAT\nserver-ip=127.0.0.1\nserver-port=0\nonline-mode=false\n'
        ['ops','whitelist','banned-players','banned-ips'].each { new File(root,"${it}.json").text='[]\n' }
        JavaExec run=tasks.getByName('runServer')
        def options = minecraft.runs.getByName('server')
        File previousDir = options.workingDir.get().asFile
        File previousRunDir = run.workingDir
        def previousProperties = new LinkedHashMap(run.systemProperties)
        def previousClasspath = files(run.classpath)
        try {
            options.workingDir.set(root)
            run.workingDir(root)
            run.systemProperty('log4j.configurationFile',file('src/integrationTest/resources/log4j2.xml').toURI())
            run.setClasspath(run.classpath.filter { !sourceSets.main.output.files.contains(it) && it != developmentOutput.get().asFile })
            run.exec()
        } finally {
            options.workingDir.set(previousDir)
            run.workingDir(previousRunDir)
            run.setSystemProperties(previousProperties)
            run.setClasspath(previousClasspath)
        }
        String text=new File(root,'logs/latest.log').text
        if(!text.contains('FORGE_PLATFORM_CONTROL_PASS') || text.contains('lootablebodies@')) throw new GradleException('Invalid independent platform control')
    }
}

