// Isolated writer compiles against public18's API and exact Java17 toolchain.
gradle.projectsEvaluated {
    def p=gradle.rootProject
    File writerRoot=p.file(p.property('historicalWriterSource'))
    def classes=p.layout.buildDirectory.dir('native118-seed/classes')
    def compile=p.tasks.register('compileNative118Seed',JavaCompile) {
        dependsOn 'classes'
        source p.fileTree(new File(writerRoot,'src/nativeSeed118/java'))
        classpath=p.files(p.sourceSets.main.output,p.sourceSets.main.compileClasspath)
        destinationDirectory=classes
        options.compilerArgs.add('-proc:none')
    }
    def jar=p.tasks.register('native118SeedJar',Jar) {
        dependsOn compile
        archiveFileName='lootablebodies-native118-world-fixtures.jar'
        destinationDirectory=p.layout.buildDirectory.dir('native118-seed')
        from classes
        from new File(writerRoot,'src/nativeSeed118/resources')
    }
    def packaged=p.renamer.classes(jar) {
        map.from p.minecraft.dependency.toSrgFile
        libraries.from(p.tasks.named('jar'),p.sourceSets.main.compileClasspath)
        output=p.layout.buildDirectory.file('native118-seed/lootablebodies-native118-world-fixtures-reobf.jar')
    }
    p.tasks.register('prepareNative118WorldFixtures') {dependsOn packaged}
}
