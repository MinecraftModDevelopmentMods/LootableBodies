import groovy.json.JsonSlurper
import java.security.MessageDigest
import java.util.jar.Manifest
import java.util.zip.ZipFile

ext.releaseNames = ['', '-sources', '-javadoc'].collect { "${base.archivesName.get()}-${version}${it}.jar".toString() }
ext.releasePomName = "${base.archivesName.get()}-${version}.pom".toString()
ext.releaseDigest = { File candidate ->
    MessageDigest.getInstance('SHA-256').digest(candidate.bytes).encodeHex().toString().toUpperCase()
}

// Apply identical archive checks to newly built jars and immutable input bundles.
ext.auditReleaseArchives = { File directory ->
    Set<String> actual = (directory.listFiles() ?: [] as File[]).findAll { it.name.endsWith('.jar') }*.name as Set
    if (actual != releaseNames as Set) throw new GradleException("Unexpected/missing artifacts: ${actual}")
    releaseNames.eachWithIndex { name, index ->
        File candidate = new File(directory, name)
        if (!candidate.isFile() || candidate.length() == 0L) throw new GradleException("Empty artifact ${name}")
        new ZipFile(candidate).withCloseable { zip ->
            Set<String> names = zip.entries().collect { it.name } as Set
            if (names.size() != zip.size()) throw new GradleException("Duplicate zip entries in ${name}")
            ['LICENSE', 'LICENSE-CC0', 'NOTICE'].each { noticeName ->
                def entry = zip.getEntry("META-INF/${noticeName}")
                if (!entry || zip.getInputStream(entry).getText('UTF-8').replace('\r\n','\n') !=
                        file(noticeName).getText('UTF-8').replace('\r\n','\n'))
                    throw new GradleException("Missing/changed licence or attribution ${noticeName} in ${name}")
            }
            zip.entries().each { entry ->
                String path = entry.name
                if (path =~ /(?i)(agent|\.codex|\.git\/|test|probe|junit|mockito|bytebuddy|credentials|\.launch$)/)
                    throw new GradleException("Forbidden archive entry ${path}")
                if (path.endsWith('.class')) {
                    if (!path.startsWith('cyano/lootable/')) throw new GradleException("Foreign production class ${path}")
                    byte[] bytes = zip.getInputStream(entry).bytes
                    int major = ((bytes[6] & 255) << 8) | (bytes[7] & 255)
                    if (major != 61) throw new GradleException("${path} is class major ${major}")
                }
                if (path.endsWith('.lang')) {
                    java.nio.charset.StandardCharsets.UTF_8.newDecoder().decode(
                            java.nio.ByteBuffer.wrap(zip.getInputStream(entry).bytes))
                }
                String content = new String(zip.getInputStream(entry).bytes, 'ISO-8859-1')
                if (content =~ /(?i)([a-z]:[\\\/]users[\\\/]|[a-z]:[\\\/]LootableBodies|\/home\/runner|\/Users\/|gh[pousr]_[A-Za-z0-9]{20}|-----BEGIN .*PRIVATE KEY-----)/)
                    throw new GradleException("Private path/credential in ${name}: ${path}")
            }
            def manifestEntry = zip.getEntry('META-INF/MANIFEST.MF')
            def manifest = manifestEntry ? new Manifest(zip.getInputStream(manifestEntry)).mainAttributes : null
            String classifier = index == 0 ? '' : index == 1 ? ':sources' : ':javadoc'
            if (manifest == null || manifest.getValue('Implementation-Version') != project.version.toString() ||
                    manifest.getValue('Implementation-Title') != project.mod_name ||
                    manifest.getValue('Implementation-Vendor') != project.mod_vendor ||
                    manifest.getValue('Implementation-License') != project.mod_license ||
                    manifest.getValue('Maven-Artifact') != "${project.group}:${base.archivesName.get()}:${project.version}${classifier}" ||
                    manifest.getValue('Implementation-Timestamp') != null || manifest.getValue('Timestamp') != null)
                throw new GradleException("Incorrect release manifest in ${name}")
            if (index == 0) {
                ['META-INF/mods.toml', 'pack.mcmeta', 'cyano/lootable/LootableBodies.class',
                 'META-INF/coremods.json', 'coremods/early-world-preservation.js',
                 'cyano/lootable/upgrade/EarlyWorldPreservation.class',
                 'assets/lootablebodies/textures/gui/corpse.png',
                 'assets/lootablebodies/textures/entity/corpse/corpse.png'].each {
                    if (!names.contains(it)) throw new GradleException("Missing production entry ${it}")
                }
                String info=zip.getInputStream(zip.getEntry('META-INF/mods.toml')).getText('UTF-8')
                ['modId="lootablebodies"',"version=\"${project.version}\"",'authors="Cyanobacterium, SkyBlade1978"','modLoader="javafml"','versionRange="[1.18.2]"'].each {
                    if(!info.contains(it))throw new GradleException("Incorrect production metadata: ${it}")
                }
                def pack=new JsonSlurper().parseText(zip.getInputStream(zip.getEntry('pack.mcmeta')).getText('UTF-8')).pack
                if(pack.pack_format!=9 || pack['forge:resource_pack_format']!=8 || pack['forge:data_pack_format']!=9)
                    throw new GradleException('Native pack formats must be pack9/resource8/data9')
                def coremods=new JsonSlurper().parseText(zip.getInputStream(zip.getEntry('META-INF/coremods.json')).getText('UTF-8'))
                if(coremods!=[lootablebodies_preservation:'coremods/early-world-preservation.js'])
                    throw new GradleException('Missing or changed early native save attachment')
                def atEntry=zip.getEntry('META-INF/accesstransformer.cfg')
                def atRules=atEntry?zip.getInputStream(atEntry).getText('UTF-8').readLines()
                        .collect {it.split('#',2)[0].trim()}.findAll {!it.isEmpty()}:[]
                if(atRules!=['public-f net.minecraft.util.datafix.DataFixers f_14510_',
                        'public net.minecraft.world.level.block.entity.SkullBlockEntity f_59755_',
                        'public net.minecraft.world.level.block.entity.SkullBlockEntity f_59756_'] ||
                        manifest.getValue('FMLAT')!='accesstransformer.cfg')
                    throw new GradleException('Missing or changed native world-reader access boundary')
                def languages=names.findAll {it.startsWith('assets/lootablebodies/lang/') && !it.endsWith('/')}
                if(languages.size()!=14 || languages.any {!it.endsWith('.json') || it!=it.toLowerCase(Locale.ROOT)})
                    throw new GradleException('Incorrect native language resources')
                if (names.any { it.endsWith('.java') || it.startsWith('net/') || it.startsWith('org/') })
                    throw new GradleException('Bundled sources or dependencies in main jar')
                String entity = new String(zip.getInputStream(zip.getEntry(
                        'cyano/lootable/entities/EntityLootableBody.class')).bytes, 'ISO-8859-1')
                if (!entity.contains('m_7378_') || !entity.contains('m_7380_'))
                    throw new GradleException('Production jar does not have runtime SRG mappings')
            } else if (index == 1) {
                if (!names.contains('cyano/lootable/LootableBodies.java'))
                    throw new GradleException('Sources jar does not contain production sources')
                def entry = zip.getEntry('META-INF/accesstransformer.cfg')
                if (!entry || zip.getInputStream(entry).getText('UTF-8').contains('\r'))
                    throw new GradleException('Source access transformer must use LF line endings')
            } else if (index == 2) {
                if (!names.contains('index.html')) throw new GradleException('Javadoc jar has no index')
                File jdk = tasks.named('javadoc', Javadoc).get().javadocTool.get().metadata.installationPath.asFile
                ['ADDITIONAL_LICENSE_INFO', 'ASSEMBLY_EXCEPTION', 'LICENSE'].each { noticeName ->
                    String complete = new File(jdk, "legal/java.base/${noticeName}").getText('UTF-8').replace('\r\n', '\n')
                    def entry = zip.getEntry("legal/${noticeName}")
                    if (complete.length() < 100 || complete.startsWith('Please see ') || !entry ||
                            zip.getInputStream(entry).getText('UTF-8') != complete)
                        throw new GradleException("Missing/changed complete JDK legal notice ${noticeName}")
                }
            }
        }
    }
}

tasks.register('verifyReleaseArtifacts') {
    group = 'verification'
    dependsOn 'assemble', 'verifyJavaSetup', 'verifyReleaseConfiguration'
    doLast {
        File libs = layout.buildDirectory.dir('libs').get().asFile
        Set<String> actual = (libs.listFiles() ?: [] as File[])*.name as Set
        if (actual != releaseNames as Set) throw new GradleException('Release output must contain exactly the three declared jars')
        auditReleaseArchives(libs)
        new ZipFile(new File(libs, releaseNames[0])).withCloseable { zip ->
            new ZipFile(tasks.jar.archiveFile.get().asFile).withCloseable { dev ->
                String cls = 'cyano/lootable/entities/EntityLootableBody.class'
                if (Arrays.equals(zip.getInputStream(zip.getEntry(cls)).bytes, dev.getInputStream(dev.getEntry(cls)).bytes))
                    throw new GradleException('Production jar was not reobfuscated')
            }
        }
    }
}
tasks.register('writeReleaseChecksums') {
    group = 'verification'
    dependsOn 'verifyReleaseArtifacts'
    doLast {
        File output = layout.buildDirectory.file('release/SHA256SUMS').get().asFile
        output.parentFile.mkdirs()
        output.setText(releaseNames.sort(false).collect { name ->
            "${releaseDigest(layout.buildDirectory.file("libs/${name}").get().asFile)}  ${name}"
        }.join('\n') + '\n', 'UTF-8')
    }
}
