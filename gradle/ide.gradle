eclipse {
    jdt.javaRuntimeName = 'JavaSE-25'
    classpath {
        downloadSources = true
        downloadJavadoc = true
        file.whenMerged { model ->
            model.entries.findAll { it.kind == 'src' && it.path == 'src/main/resources' }.each {
                // Eclipse must not overwrite expanded metadata with raw templates.
                it.path = 'build/resources/main'
            }
            Set<String> sourcePaths = new HashSet<>()
            model.entries.removeAll { it.kind == 'src' && !sourcePaths.add(it.path) }
        }
    }
    synchronizationTasks 'genEclipseRuns'
}
tasks.register('prepareEclipseResources') {
    group = 'ide'
    dependsOn 'processResources'
    doLast { copy { from layout.buildDirectory.dir('resources/main'); into 'bin/main' } }
}
tasks.register('configureEclipseBuildship') {
    group = 'ide'
    dependsOn 'verifyJavaSetup'
    doLast {
        File target = file('.settings/org.eclipse.buildship.core.prefs')
        Properties prefs = new Properties()
        if (target.isFile()) target.withInputStream { prefs.load(it) }
        ['eclipse.preferences.version': '1', 'connection.gradle.distribution': 'GRADLE_DISTRIBUTION(WRAPPER)',
         'connection.gradle.user.home': gradle.gradleUserHomeDir.canonicalPath,
         'connection.project.dir': '', 'gradle.user.home': gradle.gradleUserHomeDir.canonicalPath,
         'override.workspace.settings': 'true', 'java.home': System.getProperty('java.home')
        ].each { k, v -> prefs.setProperty(k, v) }
        target.parentFile.mkdirs()
        target.withOutputStream { prefs.store(it, 'Local Buildship settings') }
        File localJavaSetup = file('gradle-local.properties')
        Properties toolchains = new Properties()
        if (localJavaSetup.isFile()) localJavaSetup.withInputStream { toolchains.load(it) }
        toolchains.setProperty('lootablebodies.java25.home',
                productionLauncher.get().metadata.installationPath.asFile.canonicalPath)
        toolchains.setProperty('lootablebodies.mavenizer.java.home',
                mavenizerLauncher.get().metadata.installationPath.asFile.canonicalPath)
        toolchains.setProperty('minecraftAssetsDirectory', minecraftAssets.asFile.canonicalPath)
        toolchains.setProperty('minecraftNativesDirectory', minecraftNatives.asFile.canonicalPath)
        File workspacePrefs=new File(projectDir.parentFile,'.metadata/.plugins/org.eclipse.core.runtime/.settings/org.eclipse.buildship.core.prefs')
        Properties workspace=new Properties()
        if(workspacePrefs.isFile())workspacePrefs.withInputStream { workspace.load(it) }
        workspace.setProperty('eclipse.preferences.version','1')
        // Buildship uses different keys for workspace and project preferences.
        ['connection.java.home', 'connection.gradle.distribution', 'connection.gradle.user.home'].each {
            workspace.remove(it)
        }
        workspace.setProperty('java.home',file(System.getProperty('java.home')).canonicalPath)
        workspace.setProperty('gradle.distribution','GRADLE_DISTRIBUTION(WRAPPER)')
        workspace.setProperty('gradle.user.home',gradle.gradleUserHomeDir.canonicalPath)
        workspacePrefs.parentFile.mkdirs()
        workspacePrefs.withOutputStream { workspace.store(it,'Local Buildship workspace Java') }
        localJavaSetup.withOutputStream { toolchains.store(it, 'Local production Java toolchain') }
    }
}
def eclipseRunLibraries = { String run ->
    (tasks.named(run, JavaExec).get().classpath - sourceSets.main.output).files
}

tasks.register('isolateEclipseProductionRuns') {
    group = 'ide'
    dependsOn 'prepareEclipseResources', 'configureEclipseBuildship', 'prepareMinecraftAssets', 'prepareProductionRunDirectory'
    doLast {
        ['runClient.launch', 'runServer.launch'].each { name ->
            File launch = file(name)
            if (!launch.isFile()) throw new GradleException("Generate ${name} with genEclipseRuns first")
            String contents = launch.getText('UTF-8')
            File nativeRoot=minecraftNatives.asFile
            if(!nativeRoot.isDirectory())throw new GradleException('Prepare the official native 26.1.2 client inputs before generating Eclipse launches')
            contents=contents.replace('{asset_index}',minecraftAssetIndex)
                .replace('{assets_root}',minecraftAssets.asFile.absolutePath)
                .replace('{natives}',nativeRoot.absolutePath)
            contents = contents.replace('/JavaSE-8', '/JavaSE-25')
            contents = contents.replaceAll(/<booleanAttribute key="org.eclipse.jdt.launching.ATTR_EXCLUDE_TEST_CODE" value="[^"]*"\/>/, '')
            contents = contents.replace('</launchConfiguration>',
                    '  <booleanAttribute key="org.eclipse.jdt.launching.ATTR_EXCLUDE_TEST_CODE" value="true"/>\n</launchConfiguration>')
            ['--cache', '--metadata', '--to-srg', '--to-obf'].each { option ->
                int start = contents.indexOf(option + ' ')
                if (start >= 0) {
                    start += option.length() + 1
                    int end = contents.indexOf(' --', start)
                    if (end > start) {
                        String value = contents.substring(start, end)
                        if (value.find(/\s/) && !value.startsWith('&quot;'))
                            contents = contents.substring(0, start) + '&quot;' + value + '&quot;' + contents.substring(end)
                    }
                }
            }
            // Buildship combines compile and runtime dependencies. Forge's runtime
            // already embeds MixinExtras, so the compile-only common jar clashes.
            def model = new groovy.xml.XmlParser().parseText(contents)
            def classpath = model.listAttribute.find { it.@key == 'org.eclipse.jdt.launching.CLASSPATH' }
            classpath.listEntry.findAll { entry ->
                def memento = new groovy.xml.XmlParser().parseText(entry.@value)
                !memento.@projectName && !memento.@containerPath?.startsWith('org.eclipse.jdt.launching.JRE_CONTAINER')
            }.each { classpath.remove(it) }
            eclipseRunLibraries(name - '.launch').each { library ->
                def memento = new groovy.util.Node(null, 'runtimeClasspathEntry',
                        [externalArchive: library.absolutePath, type: '2', path: '5'])
                classpath.appendNode('listEntry', [value: groovy.xml.XmlUtil.serialize(memento).trim()])
            }
            launch.setText(groovy.xml.XmlUtil.serialize(model), 'UTF-8')
        }
    }
}
tasks.named('genEclipseRuns') { finalizedBy 'isolateEclipseProductionRuns' }
tasks.register('verifyEclipseProductionClasspath') {
    group = 'verification'
    dependsOn 'genEclipseRuns', 'eclipse'
    doLast {
        File workspaceFile = new File(projectDir.parentFile,
                '.metadata/.plugins/org.eclipse.core.runtime/.settings/org.eclipse.buildship.core.prefs')
        Properties workspace = new Properties()
        workspaceFile.withInputStream { workspace.load(it) }
        ['java.home': file(System.getProperty('java.home')).canonicalPath,
         'gradle.distribution': 'GRADLE_DISTRIBUTION(WRAPPER)',
         'gradle.user.home': gradle.gradleUserHomeDir.canonicalPath].each { key, expected ->
            if (workspace.getProperty(key) != expected)
                throw new GradleException("Eclipse workspace ${key} must use ${expected}; found ${workspace.getProperty(key) ?: '(unset)'}")
        }
        String classpathXml = file('.classpath').text
        if (!classpathXml.contains('path="build/resources/main"') || classpathXml.contains('path="src/main/resources"'))
            throw new GradleException('Eclipse must use Gradle-processed resources')
        def classpathModel = new groovy.xml.XmlSlurper().parseText(classpathXml)
        def outputRoots = classpathModel.classpathentry.findAll { it.@output.text() == 'bin/main' }
        if (outputRoots.collect { it.@path.text() }.toSet() != ['build/resources/main', 'src/main/java'] as Set ||
                outputRoots.size() != 2)
            throw new GradleException('Eclipse production classes and processed resources must share bin/main')
        classpathModel.classpathentry.findAll { it.@path.text() =~ /(?i)(junit|opentest4j|apiguardian)/ }.each { entry ->
            if (!entry.attributes.attribute.any { it.@name.text() == 'test' && it.@value.text() == 'true' })
                throw new GradleException('Eclipse testing library is not marked test-only')
        }
        String metadata=file('bin/main/META-INF/mods.toml').getText('UTF-8')
        if(!metadata.contains("version=\"${project.version}\"") || !metadata.contains('modId="lootablebodies"'))
            throw new GradleException('Eclipse resources are not processed production resources')
        ['runClient.launch', 'runServer.launch'].each { name ->
            String xml = file(name).text.replace('\\', '/')
            if (!xml.contains('ATTR_EXCLUDE_TEST_CODE" value="true"') ||
                    xml =~ /(?i)(src\/test|bin\/test|junit-|integration-test|mockito|byte-buddy)/ ||
                    !xml.contains('PROJECT_ATTR" value="LootableBodies"'))
                throw new GradleException("${name} has the wrong project or exposes tests")
            def launchModel = new groovy.xml.XmlSlurper().parseText(xml)
            String arguments = launchModel.stringAttribute.find {
                it.@key.text() == 'org.eclipse.jdt.launching.PROGRAM_ARGUMENTS'
            }.@value.text()
            String side = name == 'runClient.launch' ? 'client' : 'server'
            String metadataJar = "forge-${minecraft_version}-${forge_version}-metadata.zip"
            if (!arguments.contains("--launchTarget forge_userdev_${side}") ||
                    !arguments.contains('--main net.minecraftforge.bootstrap.ForgeBootstrap') ||
                    !arguments.contains(metadataJar) || (side == 'client' && !arguments.contains("--assetIndex ${minecraftAssetIndex}")) ||
                    xml.contains('{asset_index}') || xml.contains('{assets_root}') || xml.contains('{natives}'))
                throw new GradleException("Eclipse Forge metadata, target or client assets are unresolved for ${name}")
            // Forge discovers the processed mods.toml directly on the
            // project classpath. The launcher no longer reads MOD_CLASSES.
            def entries = launchModel.listAttribute.find {
                it.@key.text() == 'org.eclipse.jdt.launching.CLASSPATH'
            }.listEntry.collect { new groovy.xml.XmlSlurper().parseText(it.@value.text()) }
            if (entries.count { it.@projectName.text() == rootProject.name } != 1 ||
                    !entries.any { it.@containerPath.text().endsWith('/JavaSE-25') } ||
                    launchModel.mapAttribute.mapEntry.any { it.@key.text() == 'MOD_CLASSES' })
                throw new GradleException("${name} must launch the production Eclipse project on Java 25")
            def libraries = entries.findAll { it.@externalArchive.text() }.collect { file(it.@externalArchive.text()).canonicalFile }
            if (entries.size() != libraries.size() + 2 ||
                    libraries != eclipseRunLibraries(name - '.launch').collect { it.canonicalFile } ||
                    libraries.any { it.name.startsWith('mixinextras-common-') })
                throw new GradleException("${name} must use the Forge runtime classpath without compile-only MixinExtras")
            String directory = launchModel.stringAttribute.find {
                it.@key.text() == 'org.eclipse.jdt.launching.WORKING_DIRECTORY'
            }.@value.text()
            if (file(directory).canonicalFile != file(providers.gradleProperty('gameRunDirectory').getOrElse('run')).canonicalFile)
                throw new GradleException("${name} must use the production run directory, found ${directory}")
            if (name == 'runServer.launch' && !xml.contains('--nogui'))
                throw new GradleException('The dedicated server needs --nogui')
        }
    }
}
