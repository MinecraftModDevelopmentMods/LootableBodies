name: LootableBodies 1.16 CI

on:
  push:
    branches:
      - master-1.16.5
      - 'feature/**'
  pull_request:
    branches:
      - master-1.16.5

permissions:
  contents: read

concurrency:
  group: lootablebodies-1.16-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick:
    name: Fast build and contracts
    if: github.repository != 'MinecraftModDevelopmentMods/LootableBodies'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25.0.3+9.0.LTS'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '8.0.502+7'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17.0.1+12'
      - name: Test tools, compile, check identity and audit archives
        env:
          LOOTABLEBODIES_JAVA8_HOME: ${{ env.JAVA_HOME_8_X64 }}
          LOOTABLEBODIES_MAVENIZER_JAVA_HOME: ${{ env.JAVA_HOME_25_X64 }}
        run: |
          chmod +x ./gradlew
          python3 -m unittest discover -s tools -p 'test_*.py' -v
          ./gradlew test assemble javadoc verifyProductionRuntimeClasspath verifyEclipseProductionClasspath prepareReleaseBundle --no-daemon --stacktrace

  cold-forge-bootstrap:
    name: Cold Forge bootstrap
    if: github.repository == 'MinecraftModDevelopmentMods/LootableBodies'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pinned Java 25 ForgeGradle Mavenizer runtime
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25.0.3+9.0.LTS'

      - name: Install pinned Java 8 compilation toolchain
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '8.0.502+7'

      - name: Install pinned Java 17 Gradle runtime
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17.0.1+12'

      - name: Bootstrap Forge from an empty cache
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/lootablebodies-cold-gradle
          LOOTABLEBODIES_JAVA8_HOME: ${{ env.JAVA_HOME_8_X64 }}
          LOOTABLEBODIES_MAVENIZER_JAVA_HOME: ${{ env.JAVA_HOME_25_X64 }}
        run: |
          set -euo pipefail
          test ! -e .gradle
          test ! -e "$GRADLE_USER_HOME"
          mkdir -p "$GRADLE_USER_HOME"
          chmod +x ./gradlew
          ./gradlew classes --no-daemon --no-build-cache --stacktrace \
            -Dorg.gradle.java.installations.paths="$JAVA_HOME,$JAVA_HOME_8_X64,$JAVA_HOME_25_X64" \
            -Dorg.gradle.java.installations.auto-detect=false \
            -Dorg.gradle.java.installations.auto-download=false

      - name: Verify the same cache offline
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/lootablebodies-cold-gradle
          LOOTABLEBODIES_JAVA8_HOME: ${{ env.JAVA_HOME_8_X64 }}
          LOOTABLEBODIES_MAVENIZER_JAVA_HOME: ${{ env.JAVA_HOME_25_X64 }}
        run: |
          ./gradlew classes --offline --rerun-tasks --no-daemon --no-build-cache --stacktrace \
            -Dorg.gradle.java.installations.paths="$JAVA_HOME,$JAVA_HOME_8_X64,$JAVA_HOME_25_X64" \
            -Dorg.gradle.java.installations.auto-detect=false \
            -Dorg.gradle.java.installations.auto-download=false

  build:
    name: Build, test, and audit
    if: github.repository == 'MinecraftModDevelopmentMods/LootableBodies'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pinned Java 25 ForgeGradle Mavenizer runtime
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25.0.3+9.0.LTS'

      - name: Install pinned Java 8 compilation toolchain
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '8.0.502+7'

      - name: Install pinned Java 17 Gradle runtime
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17.0.1+12'

      - name: Pin production JDK
        run: |
          echo "LOOTABLEBODIES_JAVA8_HOME=$JAVA_HOME_8_X64" >> "$GITHUB_ENV"
          echo "LOOTABLEBODIES_MAVENIZER_JAVA_HOME=$JAVA_HOME_25_X64" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          cache-disabled: true

      - name: Make the wrapper executable
        run: chmod +x ./gradlew

      - name: Test verification tools
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v

      - name: Build, test and generate Eclipse launches
        run: >-
          ./gradlew clean build javadoc verifyEclipseProductionClasspath
          integrationTest forgeControlServer preparePackagedIntegrationProbe
          preparePackagedForgeControl prepareReleaseBundle --no-daemon --stacktrace

      - name: Verify synthetic native upgrade contracts
        run: ./gradlew upgradeContractTest -PintegrationDirectory=build/upgrade-contract-run --no-daemon

      - name: Install graphical runtime support
        timeout-minutes: 10
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            echo 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
          fi
          sudo apt-get update -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
          sudo apt-get install --yes --no-install-recommends xvfb x11-xserver-utils libgl1-mesa-dri libglu1-mesa libopenal1 pulseaudio pulseaudio-utils
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=minecraft
          echo "PULSE_SINK=minecraft" >> "$GITHUB_ENV"
          echo "ALSOFT_DRIVERS=pulse" >> "$GITHUB_ENV"
          echo "LIBGL_ALWAYS_SOFTWARE=true" >> "$GITHUB_ENV"

      - name: Install checksum-pinned official Forge distributions
        run: |
          python3 tools/native_runtime.py --java "$JAVA_HOME_8_X64/bin/java" --output build/native-server-distribution
          python3 tools/native_runtime.py --java "$JAVA_HOME_8_X64/bin/java" --output build/native-client-distribution --client

      - name: Verify the independent native respawn control
        run: xvfb-run -a -s '-screen 0 1280x720x24 +extension GLX +render -noreset' python3 tools/verify_native_respawn_control.py --java "$JAVA_HOME_8_X64/bin/java" --forge-home build/native-server-distribution --forge-client-home build/native-client-distribution --output build/native-respawn-control

      - name: Verify packaged servers and malformed inventory recovery
        run: |
          python3 tools/verify_packaged.py --java "$JAVA_HOME_8_X64/bin/java" --forge-home build/native-server-distribution --output build/packaged-runtime
          python3 tools/verify_nbt_recovery.py --java "$JAVA_HOME_8_X64/bin/java" --forge-home build/native-server-distribution --output build/packaged-nbt
          python3 tools/verify_normal_server.py --java "$JAVA_HOME_8_X64/bin/java" --forge-home build/native-server-distribution --output build/ordinary-development --development
          python3 tools/verify_normal_server.py --java "$JAVA_HOME_8_X64/bin/java" --forge-home build/native-server-distribution --output build/ordinary-packaged

      - name: Verify development graphics with processed resources
        run: xvfb-run -a -s '-screen 0 1280x720x24 +extension GLX +render -noreset' ./gradlew clientIntegrationTest --no-daemon

      - name: Verify exact packaged graphics, settings and translations
        run: |
          for mode in default config skin issues names; do
            xvfb-run -a -s '-screen 0 1280x720x24 +extension GLX +render -noreset' python3 tools/verify_packaged_client.py --java "$JAVA_HOME_8_X64/bin/java" --forge-client-home build/native-client-distribution --output "build/packaged-client-$mode" --mode "$mode"
          done

      - name: Verify recovery after a rejected first interaction
        env:
          JAVA_TOOL_OPTIONS: -Dlootablebodies.rejectFirstCorpseOpen=true -Dlootablebodies.issueClient.offsetViewer=true
        run: |
          xvfb-run -a -s '-screen 0 1280x720x24 +extension GLX +render -noreset' python3 tools/verify_packaged_client.py --java "$JAVA_HOME_8_X64/bin/java" --forge-client-home build/native-client-distribution --output build/packaged-client-rejected-interaction --mode issues
          python3 - <<'PY'
          from pathlib import Path
          log = Path('build/packaged-client-rejected-interaction/client.log').read_text()
          assert log.count('CORPSE_GUI_FIRST_INTERACTION_REJECTED_CONTROL') == 1
          assert 'ISSUE5_VIEWER_APPROACH corpse=' in log
          assert 'ISSUE5_DISTANT_VIEWER_CONFIRMED corpse=' in log
          assert 'LOOTABLE_BODIES_ISSUE5_CLIENT_PASS' in log
          PY

      - name: Verify two-player inventory, death and visibility
        env:
          JAVA_TOOL_OPTIONS: -Dlootablebodies.visibility.offsetFirstDeath=true
        run: |
          xvfb-run -a -s '-screen 0 1280x720x24 +extension GLX +render -noreset' python3 tools/verify_multiplayer.py --java "$JAVA_HOME_8_X64/bin/java" --forge-home build/native-server-distribution --forge-client-home build/native-client-distribution --output build/packaged-multiplayer
          xvfb-run -a -s '-screen 0 1280x720x24 +extension GLX +render -noreset' python3 tools/verify_visibility.py --java "$JAVA_HOME_8_X64/bin/java" --forge-home build/native-server-distribution --forge-client-home build/native-client-distribution --output build/packaged-visibility --mode visibility
          xvfb-run -a -s '-screen 0 1280x720x24 +extension GLX +render -noreset' python3 tools/verify_visibility.py --java "$JAVA_HOME_8_X64/bin/java" --forge-home build/native-server-distribution --forge-client-home build/native-client-distribution --output build/packaged-visibility-restart --mode visibility --source-server build/packaged-visibility/server
          for variant in ordinary simultaneous counter-collision; do
            extra=()
            case "$variant" in
              simultaneous) extra+=(--simultaneous);;
              counter-collision) extra+=(--counter-collision);;
            esac
            xvfb-run -a -s '-screen 0 1280x720x24 +extension GLX +render -noreset' python3 tools/verify_visibility.py --java "$JAVA_HOME_8_X64/bin/java" --forge-home build/native-server-distribution --forge-client-home build/native-client-distribution --output "build/packaged-respawn-$variant" --mode respawn --cases 16 "${extra[@]}"
          done
          xvfb-run -a -s '-screen 0 1280x720x24 +extension GLX +render -noreset' python3 tools/verify_visibility.py --java "$JAVA_HOME_8_X64/bin/java" --forge-home build/native-server-distribution --forge-client-home build/native-client-distribution --output build/packaged-respawn-restart --mode respawn --cases 16 --source-server build/packaged-respawn-ordinary/server --simultaneous --counter-collision

      - name: Audit complete runtime logs
        run: python3 tools/audit_runtime_logs.py --native --recursive build/native-respawn-control build/integration-run build/upgrade-contract-run build/client-integration-run build/packaged-runtime build/packaged-nbt build/ordinary-development build/ordinary-packaged build/packaged-client-default build/packaged-client-config build/packaged-client-skin build/packaged-client-issues build/packaged-client-names build/packaged-multiplayer build/packaged-visibility build/packaged-visibility-restart build/packaged-respawn-ordinary build/packaged-respawn-simultaneous build/packaged-respawn-restart build/packaged-respawn-counter-collision

      - name: Compare a second complete build
        run: |
          mkdir -p .gradle/repro-first
          for name in LootableBodies-2.4.7.116051.jar LootableBodies-2.4.7.116051-sources.jar LootableBodies-2.4.7.116051-javadoc.jar; do
            cp "build/libs/$name" .gradle/repro-first/
          done
          cp build/release/SHA256SUMS .gradle/repro-first/
          ./gradlew build javadoc prepareReleaseBundle --rerun-tasks --no-build-cache --no-daemon
          for name in LootableBodies-2.4.7.116051.jar LootableBodies-2.4.7.116051-sources.jar LootableBodies-2.4.7.116051-javadoc.jar; do
            cmp ".gradle/repro-first/$name" "build/libs/$name"
          done
          cmp .gradle/repro-first/SHA256SUMS build/release/SHA256SUMS
          python3 tools/verify_release_setup.py --output build/release-contracts

      - name: Require all declared reports and artifacts
        run: |
          for path in build/native-respawn-control/result.json build/libs/LootableBodies-2.4.7.116051.jar build/libs/LootableBodies-2.4.7.116051-sources.jar build/libs/LootableBodies-2.4.7.116051-javadoc.jar build/release/SHA256SUMS build/publications/mavenJava/pom-default.xml CHANGELOG.txt build/packaged-runtime/result.json build/packaged-nbt/result.json build/ordinary-development/result.json build/ordinary-packaged/result.json build/packaged-client-default/result.json build/packaged-client-config/result.json build/packaged-client-skin/result.json build/packaged-client-issues/result.json build/packaged-client-names/result.json build/packaged-multiplayer/result.json build/packaged-visibility/result.json build/packaged-visibility-restart/result.json build/packaged-respawn-ordinary/result.json build/packaged-respawn-simultaneous/result.json build/packaged-respawn-restart/result.json build/packaged-respawn-counter-collision/result.json build/release-contracts/result.json; do
            test -s "$path"
          done
          test -s build/test-results/test/TEST-cyano.lootable.contracts.NativeUpgradeBoundaryTest.xml
          test -s build/test-results/test/TEST-cyano.lootable.network.LoginReadGuardTest.xml
          test -s build/upgrade-contract-run/world/upgrade-contracts.pass

      - name: Keep native control evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Native-Forge-36-control-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            build/native-respawn-control/result.json
            build/native-respawn-control/*.log
            build/native-respawn-control/server/logs/*.log
            build/native-respawn-control/client/logs/*.log

      - name: Upload audited local candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: LootableBodies-1.16.5-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            build/libs/LootableBodies-2.4.7.116051.jar
            build/libs/LootableBodies-2.4.7.116051-sources.jar
            build/libs/LootableBodies-2.4.7.116051-javadoc.jar
            build/release/SHA256SUMS
            build/publications/mavenJava/pom-default.xml
            CHANGELOG.txt

      - name: Upload failed check evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: LootableBodies-1.16.5-diagnostics-${{ github.sha }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
          path: |
            build/reports/**
            build/test-results/**
            build/**/*.log
            build/**/crash-reports/**
            build/**/screenshots/*.png
            build/**/result.json
            build/**/*checks.txt
            .gradle/legacy-tools/released-112/build.log
            .gradle/legacy-tools/released-113/build.log
            build/packaged-client-issues/config/*.toml
            build/packaged-client-issues/saves/issue-fixture/level.dat
            build/packaged-client-issues/saves/issue-fixture/region/*.mca
            build/packaged-client-issues/saves/issue-fixture/playerdata/*.dat
