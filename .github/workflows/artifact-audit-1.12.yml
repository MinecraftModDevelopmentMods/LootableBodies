name: Audit LootableBodies 1.12 artifacts
run-name: Audit 1.12.2 artifacts from ${{ github.event.workflow_run.head_sha }}

on:
  workflow_run:
    workflows: [LootableBodies 1.10 CI, LootableBodies 1.11 CI, LootableBodies 1.12 CI]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  scope:
    name: Check artifact producer scope
    if: >-
      github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' &&
      (github.event.workflow_run.head_branch == 'master-1.12.2' || github.event.workflow_run.head_branch == 'master-1.12')
    runs-on: ubuntu-latest
    outputs:
      required: ${{ steps.scope.outputs.required }}
    steps:
      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCER_URL: ${{ github.event.workflow_run.jobs_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request
          def artifact_required(jobs):
              def exactly(name):
                  found=[j for j in jobs if j['name']==name]
                  if len(found)!=1 or found[0]['status']!='completed':raise ValueError('Missing, duplicate or pending producer job: '+name)
                  return found[0]['conclusion']
              build=exactly('Build, test, and audit')
              if build=='success':return True
              if build=='skipped' and exactly('Check runtime inputs')=='success' and exactly('Cold Forge bootstrap')=='skipped':return False
              raise ValueError('Artifact producer did not succeed')
          # Fetch the exact producer jobs; absent artifacts never imply a skip.
          url=os.environ['PRODUCER_URL']+'?per_page=100'
          if not url.startswith('https://api.github.com/repos/'+os.environ['REPOSITORY']+'/actions/runs/'):raise ValueError('Unexpected producer API URL')
          request=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(request,timeout=30) as response:result=json.load(response)
          if result['total_count']!=len(result['jobs']):raise ValueError('Incomplete producer job list')
          required=artifact_required(result['jobs'])
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:output.write('required='+str(required).lower()+'\n')
          print('Artifact audit required:',required)
          PY
  audit:
    # Successful builds always require their exact artifact. A dispatcher-only
    # change has an explicitly skipped producer and has no release bytes to audit.
    needs: scope
    if: needs.scope.outputs.required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25.0.3+9.0.LTS'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '8.0.502+7'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17.0.1+12'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: LootableBodies-1.12.2-${{ github.event.workflow_run.head_sha }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: downloaded
      - name: Require exact inputs and assemble an immutable audit bundle
        run: |
          set -euo pipefail
          mkdir audited
          for name in LootableBodies-2.4.3.112021.jar LootableBodies-2.4.3.112021-sources.jar LootableBodies-2.4.3.112021-javadoc.jar; do
            test -s "downloaded/build/libs/$name"
            cp "downloaded/build/libs/$name" audited/
          done
          test -s downloaded/build/release/SHA256SUMS
          test -s downloaded/build/publications/mavenJava/pom-default.xml
          test -s downloaded/CHANGELOG.txt
          cp downloaded/build/release/SHA256SUMS audited/
          cp downloaded/build/publications/mavenJava/pom-default.xml audited/LootableBodies-2.4.3.112021.pom
          cp downloaded/CHANGELOG.txt audited/
      - name: Audit original bytes without recompiling the jars
        env:
          LOOTABLEBODIES_JAVA8_HOME: ${{ env.JAVA_HOME_8_X64 }}
          LOOTABLEBODIES_MAVENIZER_JAVA_HOME: ${{ env.JAVA_HOME_25_X64 }}
        run: |
          chmod +x ./gradlew
          ./gradlew verifyPreparedReleaseArtifacts -PpreparedReleaseDir=audited --no-daemon
