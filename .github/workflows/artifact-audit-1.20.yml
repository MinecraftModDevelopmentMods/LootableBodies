name: Audit LootableBodies 1.20 artifacts
run-name: Audit ${{ github.event.workflow_run.head_branch == 'master-1.20.6' && '1.20.6' || '1.20.1' }} artifacts from ${{ github.event.workflow_run.head_sha }}
on:
  workflow_run:
    workflows: [LootableBodies 1.20 CI, LootableBodies 1.20.6 CI]
    types: [completed]
permissions:
  contents: read
  actions: read
jobs:
  audit:
    if: >-
      github.repository == 'MinecraftModDevelopmentMods/LootableBodies' &&
      github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' &&
      ((github.event.workflow_run.head_branch == 'master-1.20.1' && github.event.workflow_run.name == 'LootableBodies 1.20 CI') ||
      (github.event.workflow_run.head_branch == 'master-1.20.6' && github.event.workflow_run.name == 'LootableBodies 1.20.6 CI'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: LootableBodies-${{ github.event.workflow_run.head_branch == 'master-1.20.6' && '1.20.6' || '1.20.1' }}-${{ github.event.workflow_run.head_sha }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: audited
      - name: Independently verify every locally qualified byte
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          python3 -B tools/native120_build.py --bundle audited
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          accepted=json.loads(Path('.github/release120.json').read_text())
          Path('independent-audit.json').write_text(json.dumps({'source':os.environ['SOURCE_SHA'],'files':accepted['files'],'all_six_exact':True,'identical_to_locally_audited_bundle':True},indent=2)+'\n')
          PY
      # Exact hashes reuse the local class61/licence/identity/mapping audit.
      # This independent receipt is a byte match, not a fresh gameplay run or
      # another Gradle/Forge preparation. The build job audits new archives.
      - name: Retain independent audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native120-independent-audit-${{ github.event.workflow_run.head_sha }}
          if-no-files-found: error
          path: independent-audit.json
