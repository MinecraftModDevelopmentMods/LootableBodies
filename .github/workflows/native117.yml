name: LootableBodies 1.17 CI

on:
  push:
    branches: [master-1.17.1]
  pull_request:
    branches: [master-1.17.1]

permissions:
  contents: read
  actions: read

concurrency:
  group: native117-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  build:
    name: Build, test, and audit
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25.0.3+9.0.LTS'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '16.0.2+7'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17.0.1+12'
      # Gameplay, graphical clients and world migrations are qualified locally
      # before the guarded release request. Hosted CI checks build inputs only.
      - name: Test tools, compile and audit the release archives
        env:
          LOOTABLEBODIES_JAVA16_HOME: ${{ env.JAVA_HOME_16_X64 }}
          LOOTABLEBODIES_MAVENIZER_JAVA_HOME: ${{ env.JAVA_HOME_25_X64 }}
        run: |
          chmod +x gradlew
          python3 -B -m unittest discover -s tools -p 'test_*.py' -v 2>&1 | tee "$RUNNER_TEMP/native117-python-tools.log"
          ./gradlew test assemble javadoc verifyProductionRuntimeClasspath prepareReleaseBundle --no-daemon --no-build-cache --stacktrace
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          expected=json.loads(Path('.github/release117.json').read_text())['files']
          actual={p.name:hashlib.sha256(p.read_bytes()).hexdigest().upper() for p in Path('build/release/bundle').iterdir() if p.is_file()}
          if actual != expected:raise SystemExit('Release files differ from the locally qualified six-file bundle')
          PY
      - name: Retain the exact six release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: LootableBodies-1.17.1-${{ github.sha }}
          if-no-files-found: error
          path: build/release/bundle/*
      - name: Retain build and unit-test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native117-fast-${{ github.sha }}
          if-no-files-found: error
          path: |
            build/test-results/**
            build/reports/**
            build/release/bundle/*
            ${{ runner.temp }}/native117-python-tools.log
