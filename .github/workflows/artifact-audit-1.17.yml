name: Audit LootableBodies 1.17 artifacts
run-name: Audit 1.17.1 artifacts from ${{ github.event.workflow_run.head_sha }}
on:
  workflow_run:
    workflows: [LootableBodies 1.17 CI]
    types: [completed]
permissions:
  contents: read
  actions: read
jobs:
  audit:
    if: >-
      github.repository == 'MinecraftModDevelopmentMods/LootableBodies' &&
      github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master-1.17.1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25.0.3+9.0.LTS'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '16.0.2+7'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17.0.1+12'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: LootableBodies-1.17.1-${{ github.event.workflow_run.head_sha }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: audited
      - name: Independently verify every accepted byte
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          expected=json.loads(Path('.github/release117.json').read_text())['files']
          actual={p.name:hashlib.sha256(p.read_bytes()).hexdigest().upper() for p in Path('audited').iterdir() if p.is_file()}
          if actual != expected:raise SystemExit('Native117 audited bytes differ from the accepted six files')
          Path('independent-audit.json').write_text(json.dumps({'source':os.environ['SOURCE_SHA'],'files':actual,'all_six_exact':True},indent=2)+'\n')
          PY
      - name: Audit archive identity, class60, licences and mappings without rebuilding
        env:
          LOOTABLEBODIES_JAVA16_HOME: ${{ env.JAVA_HOME_16_X64 }}
          LOOTABLEBODIES_MAVENIZER_JAVA_HOME: ${{ env.JAVA_HOME_25_X64 }}
        run: |
          chmod +x ./gradlew
          ./gradlew verifyPreparedReleaseArtifacts -PpreparedReleaseDir=audited --no-daemon --console=plain --stacktrace | tee archive-audit.log
          if grep -E '^> Task :(compileJava|jar|sourcesJar|javadocJar)( |$)' archive-audit.log; then exit 1; fi
      - name: Retain independent audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native117-independent-audit-${{ github.event.workflow_run.head_sha }}
          if-no-files-found: error
          path: |
            independent-audit.json
            archive-audit.log
