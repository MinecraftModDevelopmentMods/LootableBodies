name: LootableBodies 1.14 world upgrades

on:
  push:
    branches: [master-1.14.4]
  pull_request:
    branches: [master-1.14.4]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upgrade:
    name: ${{ matrix.origin }} / ${{ matrix.stamps }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        origin: [original-110, released-110, original-111, recovery-110, released-111, original-112, recovery-111, via111-110, released-112, recovery-112, via112-110, via112-111, released-113, recovery-113, via113-110, via113-111, via113-112]
        stamps: [normal, stamps]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25.0.3+9.0.LTS'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '8.0.502+7'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17.0.1+12'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          cache-disabled: true
      - name: Pin separate toolchains
        run: |
          echo "LOOTABLEBODIES_JAVA8_HOME=$JAVA_HOME_8_X64" >> "$GITHUB_ENV"
          echo "LOOTABLEBODIES_MAVENIZER_JAVA_HOME=$JAVA_HOME_25_X64" >> "$GITHUB_ENV"
          chmod +x ./gradlew
      - name: Build historical fixture tools against the released API
        run: python3 tools/prepare_legacy_tools.py --java17-home "$JAVA_HOME" --java8-home "$JAVA_HOME_8_X64" --java25-home "$JAVA_HOME_25_X64"
      - name: Build the released 1.13 fixture tools
        run: python3 tools/prepare_native113_tools.py --java17-home "$JAVA_HOME" --java8-home "$JAVA_HOME_8_X64" --java25-home "$JAVA_HOME_25_X64"
      - name: Build candidate and isolated fixture writers
        run: ./gradlew build prepareLegacyWorldFixtures preparePackagedIntegrationProbe preparePackagedForgeControl --no-daemon
      - name: Download and verify historical artifacts
        run: python3 tools/prepare_migration_inputs.py --java "$JAVA_HOME_8_X64/bin/java" --output build/migration-inputs
      - name: Install the native Forge target
        run: python3 tools/native_runtime.py --java "$JAVA_HOME_8_X64/bin/java" --output build/native-server-distribution
      - name: Create worlds with historical mod writers
        run: >-
          python3 tools/verify_world_upgrades.py --java "$JAVA_HOME_8_X64/bin/java"
          --forge110-home build/migration-inputs/forge110 --forge111-home build/migration-inputs/forge111 --forge112-home build/migration-inputs/forge112 --forge113-home build/migration-inputs/forge113
          --original-110 build/migration-inputs/original-110.jar --released-110 build/migration-inputs/released-110.jar
          --original-111 build/migration-inputs/original-111.jar --released-111 build/migration-inputs/released-111.jar --original-112 build/migration-inputs/original-112.jar --released-112 build/migration-inputs/released-112.jar --released-113 build/migration-inputs/released-113.jar --origins ${{ matrix.origin }}
          --seed-only --output build/migration-seeds
      - name: Verify first load, recovery, deferred dimensions and restarts
        run: >-
          python3 tools/verify_world_upgrades.py --java "$JAVA_HOME_8_X64/bin/java"
          --forge110-home build/migration-inputs/forge110 --forge111-home build/migration-inputs/forge111 --forge112-home build/migration-inputs/forge112 --forge113-home build/migration-inputs/forge113
          --original-110 build/migration-inputs/original-110.jar --released-110 build/migration-inputs/released-110.jar
          --original-111 build/migration-inputs/original-111.jar --released-111 build/migration-inputs/released-111.jar --original-112 build/migration-inputs/original-112.jar --released-112 build/migration-inputs/released-112.jar --released-113 build/migration-inputs/released-113.jar --origins ${{ matrix.origin }}
          --seeds build/migration-seeds --variants ${{ matrix.stamps }}
          --forge114-home build/native-server-distribution --output build/migration-results
      - name: Verify unsafe preservation stops world loading
        run: >-
          python3 tools/verify_upgrade_abort.py --java "$JAVA_HOME_8_X64/bin/java"
          --forge-home build/native-server-distribution
          --source-world build/migration-seeds/${{ matrix.origin }}/world --output build/migration-abort
      - name: Require every report
        run: |
          for path in build/migration-inputs/inputs.json build/migration-seeds/seed-report.json build/migration-results/result.json build/migration-abort/result.json; do
            test -s "$path"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: LootableBodies-1.14.4-upgrade-${{ matrix.origin }}-${{ matrix.stamps }}-${{ github.sha }}
          if-no-files-found: error
          path: |
            build/migration-inputs/inputs.json
            build/migration-seeds/seed-report.json

            build/migration-results/result.json
            build/migration-abort/result.json
      - name: Upload failed run diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: LootableBodies-1.14.4-upgrade-failure-${{ matrix.origin }}-${{ matrix.stamps }}-${{ github.sha }}
          if-no-files-found: error
          path: |
            build/reports/**
            build/migration-*/**/*.log
            build/migration-*/**/crash-reports/**
            build/migration-abort/**/comparison.json
            build/native-server-distribution/**/*.log
