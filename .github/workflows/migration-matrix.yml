name: LootableBodies 1.15 world upgrades

on:
  push:
    branches: [master-1.15.2]
  pull_request:
    branches: [master-1.15.2]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lootablebodies-1.15-upgrades-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare verified migration inputs
    if: github.repository == 'MinecraftModDevelopmentMods/LootableBodies'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25.0.3+9.0.LTS'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '8.0.502+7'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17.0.1+12'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          cache-disabled: true
      - name: Pin separate toolchains
        run: |
          echo "LOOTABLEBODIES_JAVA8_HOME=$JAVA_HOME_8_X64" >> "$GITHUB_ENV"
          echo "LOOTABLEBODIES_MAVENIZER_JAVA_HOME=$JAVA_HOME_25_X64" >> "$GITHUB_ENV"
          chmod +x ./gradlew
      - name: Build historical fixture tools against the released API
        run: python3 tools/prepare_legacy_tools.py --java17-home "$JAVA_HOME" --java8-home "$JAVA_HOME_8_X64" --java25-home "$JAVA_HOME_25_X64"
      - name: Build the released 1.13 fixture tools
        run: python3 tools/prepare_native113_tools.py --java17-home "$JAVA_HOME" --java8-home "$JAVA_HOME_8_X64" --java25-home "$JAVA_HOME_25_X64"
      - name: Build the released 1.14 fixture tools
        run: python3 tools/prepare_native114_tools.py --java17-home "$JAVA_HOME" --java8-home "$JAVA_HOME_8_X64" --java25-home "$JAVA_HOME_25_X64"
      - name: Build candidate and isolated fixture writers
        run: ./gradlew assemble test prepareLegacyWorldFixtures preparePackagedIntegrationProbe --no-daemon
      - name: Download and verify historical artifacts
        run: python3 tools/prepare_migration_inputs.py --java "$JAVA_HOME_8_X64/bin/java" --output build/migration-inputs
      - name: Install the native Forge target
        run: python3 tools/native_runtime.py --java "$JAVA_HOME_8_X64/bin/java" --output build/native-server-distribution
      - name: Create worlds with historical mod writers
        run: >-
          python3 tools/verify_world_upgrades.py --java "$JAVA_HOME_8_X64/bin/java"
          --forge110-home build/migration-inputs/forge110 --forge111-home build/migration-inputs/forge111 --forge112-home build/migration-inputs/forge112 --forge113-home build/migration-inputs/forge113 --forge114-home build/migration-inputs/forge114
          --original-110 build/migration-inputs/original-110.jar --released-110 build/migration-inputs/released-110.jar
          --original-111 build/migration-inputs/original-111.jar --released-111 build/migration-inputs/released-111.jar --original-112 build/migration-inputs/original-112.jar --released-112 build/migration-inputs/released-112.jar --released-113 build/migration-inputs/released-113.jar --released-114 build/migration-inputs/released-114.jar
          --seed-only --output build/migration-seeds
      - name: Seal the explicit inputs without Gradle caches
        run: python3 tools/migration_ci.py seal --commit "$GITHUB_SHA"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: LootableBodies-1.15.2-migration-inputs-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          path: |
            build/migration-ci-inputs/inputs.json
            build/migration-ci-inputs/inputs.tar.gz
      - name: Retain preparation failures
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: LootableBodies-1.15.2-migration-preparation-failure-${{ github.sha }}
          if-no-files-found: error
          include-hidden-files: true
          path: |
            build/migration-*/**/*.log
            build/migration-*/**/crash-reports/**
            build/native-server-distribution/**/*.log
            .gradle/legacy-tools/released-112/build.log
            .gradle/legacy-tools/released-113/build.log
            .gradle/legacy-tools/released-114/build.log

  upgrade:
    name: Historical world shard ${{ matrix.shard }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '8.0.502+7'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: LootableBodies-1.15.2-migration-inputs-${{ github.sha }}
          path: build/migration-ci-inputs
      - name: Verify and restore exact inputs
        run: python3 tools/migration_ci.py restore --commit "$GITHUB_SHA"
      - name: Qualify both stamp variants, restarts and unsafe preservation
        run: python3 tools/migration_ci.py shard --commit "$GITHUB_SHA" --shard ${{ matrix.shard }} --java "$JAVA_HOME/bin/java"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: LootableBodies-1.15.2-upgrade-shard-${{ matrix.shard }}-${{ github.sha }}
          if-no-files-found: error
          path: |
            build/migration-ci/report.json
            build/migration-results/result.json
            build/migration-abort/result.json
            build/migration-results/**/*.log
            build/migration-abort/**/*.log
            build/migration-abort/**/crash-reports/**
            build/migration-abort/**/comparison.json
      - name: Retain failed world evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: LootableBodies-1.15.2-upgrade-shard-failure-${{ matrix.shard }}-${{ github.sha }}
          if-no-files-found: error
          include-hidden-files: true
          path: |
            build/migration-results/**/*.log
            build/migration-results/**/crash-reports/**
            build/migration-abort/**/*.log
            build/migration-abort/**/crash-reports/**
            build/migration-abort/**/comparison.json
            build/migration-ci-inputs/inputs.json

  aggregate:
    name: World upgrade matrix
    needs: [prepare, upgrade]
    if: always() && github.repository == 'MinecraftModDevelopmentMods/LootableBodies'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require successful preparation and every shard
        env:
          PREPARE: ${{ needs.prepare.result }}
          UPGRADE: ${{ needs.upgrade.result }}
        run: test "$PREPARE" = success && test "$UPGRADE" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: LootableBodies-1.15.2-upgrade-shard-*-${{ github.sha }}
          path: build/migration-shards
      - name: Require all 46 cases, 460 JVM phases and 92 safe refusals
        run: python3 tools/migration_ci.py aggregate --commit "$GITHUB_SHA" --folder build/migration-shards
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: LootableBodies-1.15.2-world-upgrades-${{ github.sha }}
          if-no-files-found: error
          path: build/migration-summary.json
