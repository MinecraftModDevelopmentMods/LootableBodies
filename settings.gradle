plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}
rootProject.name = 'LootableBodies'

// Local qualification and manual testing come before hosted checks.
if (System.getenv('GITHUB_ACTIONS') == 'true' &&
        System.getenv('GITHUB_REPOSITORY') != 'MinecraftModDevelopmentMods/LootableBodies') {
    throw new GradleException('Hosted builds are limited to the MMD repository')
}
